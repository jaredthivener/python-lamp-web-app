[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-lamp-web-app"
version = "0.1.0"
description = "A lamp with a pull cord, shared live by everyone looking at it"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jared T"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
# The only dependency list: the Docker image and the dev container both install from here.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    # Database dependencies
    "sqlalchemy==2.1.3",
    "psycopg2-binary==2.9.13",
    # Signs in to Azure Postgres as the pod's identity, so there is no password to keep
    "azure-identity==1.26.0",
]

# PEP 735 dependency groups (top-level, not under [project])
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx2>=1.0.0",  # FastAPI's TestClient
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/jaredthivener/python-lamp-web-app"
Repository = "https://github.com/jaredthivener/python-lamp-web-app"
Issues = "https://github.com/jaredthivener/python-lamp-web-app/issues"

# Hatchling build configuration
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Hatch environment for dev
[tool.hatch.envs.dev]
group = "dev"
inherit = ["default"]

[tool.black]
target-version = ['py314']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
