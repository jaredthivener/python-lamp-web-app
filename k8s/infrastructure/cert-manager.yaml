# cert-manager obtains and renews the site's TLS certificate from Let's Encrypt.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 12h
  url: oci://quay.io/jetstack/charts/cert-manager
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: "1.x" # new 1.x releases are picked up at the next interval
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m # how often the release is checked for drift
  releaseName: cert-manager
  targetNamespace: cert-manager
  # cert-manager only watches Gateways if the Gateway API definitions exist when it starts
  dependsOn:
    - name: envoy-gateway
  chartRef:
    kind: OCIRepository
    name: cert-manager
  # Put back anything in the release that someone changes by hand
  driftDetection:
    mode: enabled
    # ...except what AKS changes. Its admissions enforcer adds exclusions for AKS's own
    # namespaces to this webhook's namespaceSelector, and adds them again each time
    # they are removed. Undoing that leaves the release never ready, and nothing that
    # depends on it is applied.
    ignore:
      - paths: ["/webhooks/0/namespaceSelector"]
        target:
          kind: ValidatingWebhookConfiguration
  # A failed upgrade is rolled back to the release that worked
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true # the CRDs are part of the release, so upgrades update them
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true # answer ACME challenges through the Gateway, not an Ingress
    # The chart sets no requests or limits. Small requests let the scheduler account for
    # these pods without reserving much of a 2-vCPU node; limits keep any one of them
    # from starving its neighbours.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
