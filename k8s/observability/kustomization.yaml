# Applied after the namespaces and before the app (see infra/modules/compute/aks.bicep). The config
# is generated, so its name carries a hash: a changed config rolls the collector's pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Without this the generated ConfigMap has no namespace, and kustomize does not point the
# Deployment at its hashed name (seen with `flux build`).
namespace: observability
resources:
  - otel-gateway.yaml
configMapGenerator:
  - name: otel-gateway-config
    files:
      - config.yaml
