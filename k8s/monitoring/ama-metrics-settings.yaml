# What the cluster's Managed Prometheus collects. The add-on reads this ConfigMap by this exact
# name in kube-system, and restarts its pods two to three minutes after it changes. It is Microsoft's
# schema v2 template (Azure/prometheus-collector, otelcollector/configmaps/ama-metrics-settings-configmap.yaml),
# with the differences below. https://learn.microsoft.com/azure/azure-monitor/containers/prometheus-metrics-scrape-configuration
#
# - CoreDNS is on (it is off when there is no ConfigMap): the DNS dashboard. Microsoft's minimal list still
#   names coredns_forward_*, which CoreDNS 1.14 (what AKS runs) no longer exposes: upstream requests are
#   coredns_proxy_*, so those are added to the keep list.
# - kube-proxy is off: the Cilium data plane does not use it.
# - Targets this cluster has nothing for (Windows, GPU, storage add-ons, Istio) are off, and so are
#   the container network observability targets: Cilium and Hubble metrics need Advanced Container
#   Networking Services, which costs $0.025 per node-hour (see infra/README.md).
# - The minimal ingestion profile stays on, which keeps only the metrics Microsoft's own dashboards use.
#   Each keep list below adds what this repository's dashboards and alerts use on top of it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v2
  config-version: ver1
  cluster-metrics: |-
    default-targets-scrape-enabled: |-
      kubelet = true
      coredns = true
      cadvisor = true
      kubeproxy = false
      apiserver = false
      kubestate = true
      nodeexporter = true
      windowsexporter = false
      windowskubeproxy = false
      kappiebasic = false
      networkobservabilityRetina = false
      networkobservabilityHubble = false
      networkobservabilityCilium = false
      acstor-capacity-provisioner = false
      acstor-metrics-exporter = false
      local-csi-driver = false
      ztunnel = false
      istio-cni = false
      dcgmexporter = false
      prometheuscollectorhealth = false
    pod-annotation-based-scraping: |-
      podannotationnamespaceregex = ""
    default-targets-metrics-keep-list: |-
      kubelet = "kubelet_running_pods|kubelet_node_name|kubelet_pleg_relist_duration_seconds_sum|kubelet_pleg_relist_duration_seconds_count|kubelet_runtime_operations_errors_total"
      coredns = "coredns_proxy_request_duration_seconds_bucket|coredns_proxy_request_duration_seconds_sum|coredns_proxy_request_duration_seconds_count|coredns_proxy_conn_cache_hits_total|coredns_proxy_conn_cache_misses_total|coredns_cache_requests_total"
      cadvisor = "container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_oom_events_total|container_memory_working_set_bytes|container_network_transmit_packets_dropped_total|container_network_receive_errors_total|container_network_transmit_errors_total"
      kubeproxy = ""
      apiserver = ""
      kubestate = "kube_node_info|kube_node_spec_unschedulable|kube_node_status_condition|kube_pod_status_phase|kube_pod_status_ready|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_waiting_reason|kube_deployment_spec_replicas|kube_deployment_status_replicas_available|kube_deployment_status_replicas_unavailable|kube_deployment_status_replicas_updated|kube_daemonset_status_desired_number_scheduled|kube_daemonset_status_number_unavailable|kube_poddisruptionbudget_status_pod_disruptions_allowed|kube_poddisruptionbudget_status_current_healthy|kube_poddisruptionbudget_status_desired_healthy"
      nodeexporter = "node_load1|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_network_receive_drop_total|node_network_transmit_drop_total|node_network_receive_errs_total|node_network_transmit_errs_total|node_netstat_Tcp_RetransSegs|node_netstat_Tcp_OutSegs|node_netstat_TcpExt_TCPSynRetrans|node_nf_conntrack_entries|node_nf_conntrack_entries_limit|node_vmstat_oom_kill|node_disk_io_time_seconds_total"
      windowsexporter = ""
      windowskubeproxy = ""
      podannotations = ""
      kappiebasic = ""
      networkobservabilityRetina = ""
      networkobservabilityHubble = ""
      networkobservabilityCilium = ""
      acstor-capacity-provisioner = ""
      acstor-metrics-exporter = ""
      local-csi-driver = ""
      ztunnel = ""
      istio-cni = ""
      dcgmexporter = ""
    minimal-ingestion-profile: |-
      enabled = true
    default-targets-scrape-interval-settings: |-
      kubelet = "30s"
      coredns = "30s"
      cadvisor = "30s"
      kubeproxy = "30s"
      apiserver = "30s"
      kubestate = "30s"
      nodeexporter = "30s"
      windowsexporter = "30s"
      windowskubeproxy = "30s"
      kappiebasic = "30s"
      networkobservabilityRetina = "30s"
      networkobservabilityHubble = "30s"
      networkobservabilityCilium = "30s"
      acstor-capacity-provisioner = "30s"
      acstor-metrics-exporter = "30s"
      local-csi-driver = "30s"
      ztunnel = "30s"
      istio-cni = "30s"
      dcgmexporter = "30s"
      prometheuscollectorhealth = "30s"
      podannotations = "30s"
  controlplane-metrics: |-
    default-targets-scrape-enabled: |-
      apiserver = true
      cluster-autoscaler = false
      node-auto-provisioning = false
      kube-scheduler = false
      kube-controller-manager = false
      etcd = true
      istio = false
    default-targets-metrics-keep-list: |-
      apiserver = ""
      cluster-autoscaler = ""
      node-auto-provisioning = ""
      kube-scheduler = ""
      kube-controller-manager = ""
      etcd = "etcd_mvcc_db_total_size_in_bytes|etcd_server_has_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_failed_total"
      istio = ""
    minimal-ingestion-profile: |-
      enabled = true
  prometheus-collector-settings: |-
    cluster_alias = ""
    debug-mode = false
    https_config = true
    secrets_access_namespaces = ""
