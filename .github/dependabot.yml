# Enable Dependabot for automatic dependency updates
version: 2
updates:
  # Python dependencies (using uv for dependency management)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # No assignees: these merge themselves (see workflows/dependabot-automerge.yml), and
    # being assigned is what sends an email for every one of them.
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "fastapi"
    # Group updates for better management
    groups:
      fastapi-core:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "starlette*"
      web-dependencies:
        patterns:
          - "pydantic*"
      async-dependencies:
        patterns:
          - "anyio*"
          - "httpx*"
          - "aiofiles*"
      development-dependencies:
        patterns:
          - "pytest*"
          - "black*"
          - "mypy*"
          - "httpx*"
          - "ruff*"
    rebase-strategy: "auto"
    # Allow automatic security updates for critical vulnerabilities
    allow:
      - dependency-type: "all"
    # Ignore specific dependencies that should be manually managed
    ignore:
      - dependency-name: "python"
        # Ignore Python version updates as these should be carefully tested

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    # The workflows, and the action in this repository that they use
    directories:
      - "/"
      - "/.github/actions/harden-image"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    rebase-strategy: "auto"

  # Docker base images: the FROM lines in the Dockerfile (Python twice, and the distroless runtime),
  # and the OpenTelemetry collector's image in the Kubernetes manifest
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/k8s/observability"
    schedule:
      interval: "weekly"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "docker"
      include: "scope"
    rebase-strategy: "auto"
    ignore:
      # Patch releases and rebuilt images merge themselves. A new minor (3.16) is a change to
      # .python-version, pyproject.toml and the site-packages path in the Dockerfile as well,
      # so it is done by hand.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The collector is 0.x: its configuration syntax has changed between minor versions (azure_auth
      # in 0.148), so only patch releases merge themselves. CI validates the config against the
      # new image (.github/scripts/validate-collector.sh), which catches the rest.
      - dependency-name: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
