name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run lamp physics tests
        run: npm test

      # uv takes the Python version from .python-version: the same minor as the production image
      - name: Run tests on SQLite
        run: uv run pytest

      - name: Run tests on Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres

      # The tests above run on a bare Python. This is the image that ships, so a base image
      # update from Dependabot only merges if the result starts and reaches the database.
      - name: Build the image and check it serves
        run: |
          docker build -t lamp .
          docker run -d --name lamp --network host \
            -e POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres lamp
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8000/health \
            | grep '"database":"postgresql"' || { docker logs lamp; exit 1; }
