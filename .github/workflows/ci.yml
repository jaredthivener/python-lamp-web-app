name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Run lamp physics tests
        run: npm test

      # The manifests Flux applies, checked before they merge instead of on the cluster:
      # every field against its schema, with the ${PLACEHOLDERS} filled in the way Flux
      # fills them. A placeholder missing from this list fails here; one missing from
      # manifestValues in infra/main.bicep fails on the cluster.
      - name: Install the Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          plugins: schema@0.15.0

      - name: Validate the Kubernetes manifests
        run: |
          cat > "$RUNNER_TEMP/values.env" <<'EOF'
          LAMP_HOST=lamp.example.com
          PUBLIC_IP_NAME=lamp-ip
          PUBLIC_IP_RESOURCE_GROUP=rg-lamp
          APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=00000000-0000-0000-0000-000000000000
          APP_IDENTITY_CLIENT_ID=00000000-0000-0000-0000-000000000000
          POSTGRES_CONNECTION_STRING=host=db.example.com dbname=lamp user=lamp-app sslmode=require
          EOF
          flux schema validate k8s --schema-location default --schema-location ecosystem \
            --envsubst-file "$RUNNER_TEMP/values.env" --envsubst-strict \
            --skip-kind monitor.azure.com/v1/Instrumentation # the AKS add-on's CRD has no published schema

      # uv takes the Python version from .python-version: the same minor as the production image
      - name: Run tests on SQLite
        run: uv run pytest

      - name: Run tests on Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres

      # The tests above run on a bare Python. This is the image that ships, so a base image
      # update from Dependabot only merges if the result starts and reaches the database.
      - name: Build the image
        run: docker build -t lamp:ci .

      # The same patch-and-check the published image gets, so a base image that cannot pass it
      # fails here, on the pull request, and not after the merge.
      - name: Patch the image and check it for fixable findings
        uses: ./.github/actions/harden-image
        with:
          image: lamp:ci

      - name: Check the image serves
        run: |
          docker run -d --name lamp --network host \
            -e POSTGRES_CONNECTION_STRING=postgresql://postgres:postgres@localhost:5432/postgres lamp:ci
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8000/health \
            | grep '"database":"postgresql"' || { docker logs lamp; exit 1; }

  # Everything that lands on main, once its tests have passed, is published for the
  # cluster: the image, and the k8s/ folder as a bundle with that image's tag written in.
  # Flux, running in the cluster, notices the new bundle and applies it. Nothing here
  # talks to Kubernetes.
  publish:
    name: Publish
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm # the cluster's nodes are Arm64, so the image is built on Arm64
    permissions:
      contents: read
      id-token: write # lets the job prove to Azure which repository and branch it is: no stored password
    # One publish at a time. A run that is waiting is replaced by a newer one, which is right:
    # only the newest commit on main is ever tagged latest.
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-lamp-web-app-dev
    outputs:
      digest: ${{ steps.manifests.outputs.digest }} # the bundle the cluster is meant to run, if this run moved latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the registry
        id: registry
        run: |
          name=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" --output tsv 2>/dev/null || true)
          if [ -z "$name" ]; then
            echo "::notice::Nothing was published: there is no registry in $RESOURCE_GROUP. Run the Deploy Azure Infrastructure workflow first."
          fi
          echo "server=${name:+$name.azurecr.io}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        if: steps.registry.outputs.server != ''
        env:
          REGISTRY: ${{ steps.registry.outputs.server }}
          IMAGE: ${{ steps.registry.outputs.server }}/lamp-app:${{ github.sha }}
        run: |
          az acr login --name "$REGISTRY"
          docker build --tag "$IMAGE" .

      - name: Patch the image and check it for fixable findings
        if: steps.registry.outputs.server != ''
        uses: ./.github/actions/harden-image
        with:
          image: ${{ steps.registry.outputs.server }}/lamp-app:${{ github.sha }}

      - name: Push the image
        if: steps.registry.outputs.server != ''
        env:
          IMAGE: ${{ steps.registry.outputs.server }}/lamp-app:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Install the Flux CLI
        if: steps.registry.outputs.server != ''
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: Publish the manifests
        id: manifests
        if: steps.registry.outputs.server != ''
        env:
          REGISTRY: ${{ steps.registry.outputs.server }}
        run: |
          # Point the bundle at the image built above
          sed -i "s|registry.invalid/lamp-app|$REGISTRY/lamp-app|; s|newTag: unpublished|newTag: $GITHUB_SHA|" k8s/app/kustomization.yaml
          grep -q "newTag: $GITHUB_SHA" k8s/app/kustomization.yaml

          digest=$(flux push artifact "oci://$REGISTRY/manifests/lamp:$GITHUB_SHA" --path k8s \
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision "main@sha1:$GITHUB_SHA" \
            --output json | jq -r .digest)
          # "latest" is the tag the cluster follows. It only ever moves to the newest
          # commit on main, so a run that finishes late, or is run again, cannot put
          # older code back.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            flux tag artifact "oci://$REGISTRY/manifests/lamp:$GITHUB_SHA" --tag latest
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on: $GITHUB_SHA was published, and latest was left alone."
          fi

  # Publishing ends when the bundle is in the registry. This waits for the cluster to say it
  # runs it, then looks at what a visitor and the telemetry pipeline would see. Microsoft's
  # Bicep pipelines guidance ends with "test your resources after each deployment":
  # https://learn.microsoft.com/training/modules/test-bicep-code-using-github-actions/
  verify:
    name: Verify rollout
    needs: publish
    if: needs.publish.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-lamp-web-app-dev
      DIGEST: ${{ needs.publish.outputs.digest }}

    steps:
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The cluster is switched off overnight. Flux cannot sync a cluster that is not running,
      # and the next start applies whatever latest is by then.
      - name: Find the cluster and the site
        id: target
        run: |
          cluster=$(az aks list --resource-group "$RESOURCE_GROUP" --query "[0].name" --output tsv)
          power=$(az aks show --resource-group "$RESOURCE_GROUP" --name "$cluster" --query powerState.code --output tsv)
          host=$(az network public-ip list --resource-group "$RESOURCE_GROUP" --query "[?dnsSettings!=null].dnsSettings.fqdn | [0]" --output tsv)
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "running=$([ "$power" = Running ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$power" = Running ] || echo "::notice::The cluster is $power: nothing to verify. The next start applies this bundle."

      # sourceSyncedCommitId is "latest@sha256:<digest>" of the bundle Flux last pulled
      - name: Wait for Flux to apply this bundle
        if: steps.target.outputs.running == 'true'
        env:
          CLUSTER: ${{ steps.target.outputs.cluster }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ContainerService/managedClusters/$CLUSTER/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/lamp?api-version=2025-04-01"
          for _ in $(seq 1 60); do
            state=$(az rest --method get --url "$url" --query "[properties.sourceSyncedCommitId, properties.complianceState]" --output tsv | tr '\n' ' ')
            echo "$state"
            case "$state" in *"$DIGEST"*Compliant*) exit 0 ;; esac
            sleep 15
          done
          echo "::error::Flux did not report $DIGEST as applied and compliant within 15 minutes."
          exit 1

      - name: The site answers, and reaches its database
        if: steps.target.outputs.running == 'true'
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "https://$HOST/health" \
            | tee /dev/stderr | grep -q '"database":"postgresql"'

      # Telemetry is a preview feature, and whether this login may read the workspace has not been
      # tried: a failure here is a warning, not a red build.
      - name: Spans reach Application Insights
        if: steps.target.outputs.running == 'true'
        continue-on-error: true
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true > /dev/null
          component=$(az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.Insights/components --query "[0].id" --output tsv)
          workspace=$(az rest --method get --url "https://management.azure.com${component}?api-version=2025-01-23-preview" --query properties.WorkspaceResourceId --output tsv)
          customer=$(az rest --method get --url "https://management.azure.com${workspace}?api-version=2025-02-01" --query properties.customerId --output tsv)
          for _ in $(seq 1 12); do
            for _ in $(seq 1 10); do curl --silent --output /dev/null "https://$HOST/api/v1/lamp/status"; done
            n=$(az monitor log-analytics query --workspace "$customer" --output tsv \
              --analytics-query "OTelSpans | where TimeGenerated > ago(10m) and ServiceName == 'lamp-app' | count" | head -1 | cut -f1)
            echo "spans in the last 10 minutes: ${n:-0}"
            [ "${n:-0}" -gt 0 ] && exit 0
            sleep 30
          done
          echo "::warning::No lamp-app spans reached Application Insights. If this is a fresh deploy, the pods need a restart to pick up the OTEL_* settings."
          exit 1
