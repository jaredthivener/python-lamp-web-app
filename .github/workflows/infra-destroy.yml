name: Destroy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

# Set permissions for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
  AZURE_DEV_COLLECT_TELEMETRY: "no"

jobs:
  destroy-infrastructure:
    runs-on: ubuntu-latest
    # The environment's protection rules (a required reviewer, main branch only) are what stand
    # between a workflow run and the subscription: the job does not start until they pass.
    # Its OIDC subject is repo:<owner>/<repo>:environment:<name>, one of the federated
    # credentials on the app registration.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    # Deploy and Destroy share a group, so neither runs while the other does. Nothing is
    # cancelled: stopping a deployment half way is worse than waiting for it.
    concurrency:
      group: azure-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Azure CLI
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deleting the group only soft-deletes its Log Analytics workspace: Azure keeps it
      # for 14 days, and a deployment within that time gets the old workspace back
      # instead of a new one. For its first minutes the recovered workspace has no
      # container tables, and the deployment fails creating the log collection rule.
      # Microsoft's guidance for environments that are deployed repeatedly under the
      # same name is to delete the workspace permanently:
      # https://learn.microsoft.com/azure/azure-monitor/logs/delete-workspace#delete-a-workspace-permanently
      #
      # The REST call, not `az monitor log-analytics workspace delete --force`: on these
      # runners that command, like the CLI's other long-running ones, sometimes crashes
      # before it has sent anything (https://github.com/Azure/azure-cli/issues/33996).
      - name: Delete the Log Analytics workspace permanently
        run: |
          group="rg-lamp-web-app-${{ env.AZURE_ENV_NAME }}"
          workspaces() { az monitor log-analytics workspace list --resource-group "$group" --query "[].id" --output tsv; }
          for id in $(workspaces); do
            az rest --method delete --url "${id}?api-version=2025-07-01&force=true"
          done
          # The call returns before the workspace has gone. Wait for that, so the group's
          # own deletion finds nothing left to soft-delete.
          for _ in $(seq 1 30); do
            [ -z "$(workspaces)" ] && exit 0
            sleep 10
          done
          echo "::error::The workspace is still there after five minutes."
          exit 1

      - name: Delete resource group
        run: az group delete --name rg-lamp-web-app-${{ env.AZURE_ENV_NAME }} --yes --no-wait
