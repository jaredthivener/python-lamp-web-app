name: Infrastructure checks

# What Microsoft's Bicep pipelines guidance puts before a deployment: lint, preflight
# validation, and a what-if preview attached to the pull request, so the change is reviewed
# before the Deploy workflow runs it.
# https://learn.microsoft.com/devops/deliver/iac-github-actions
# https://learn.microsoft.com/training/modules/test-bicep-code-using-github-actions/
#
# Only runs for changes under infra/, so nothing else waits for it. It is not a required
# check: a required check that is skipped for other pull requests would block them.

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Errors fail the job. The BCP081 warnings ("does not have types available") are for
      # preview API versions the Bicep type data has not caught up with, and are expected.
      - name: Build and lint
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  preview:
    name: Validate and preview
    needs: lint
    # Pull requests from forks and from Dependabot get no secrets or Azure login
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the Azure login: this job's OIDC subject is repo:<owner>/<repo>:pull_request
      pull-requests: write # the preview comment
    env:
      AKS_ADMIN_OBJECT_ID: ${{ secrets.AKS_ADMIN_OBJECT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Asks Azure Resource Manager whether it would accept the deployment: the checks the
      # linter cannot make (quota, policy, names that are taken)
      - name: Validate against Azure
        run: az deployment sub validate --location westus3 --parameters infra/main.bicepparam --only-show-errors --output none

      # What-if reports an unchanged deployment as modifying nearly everything: Azure's own
      # default values show up as deleted properties (Microsoft calls it noise). So the
      # comment leads with what is created or deleted, and keeps the rest folded away.
      - name: Preview the changes
        run: |
          az deployment sub what-if --location westus3 --parameters infra/main.bicepparam \
            --no-pretty-print --only-show-errors > whatif.json
          python3 - <<'EOF' > comment.md
          import json
          changes = json.load(open("whatif.json"))["changes"]
          name = lambda c: c["resourceId"].split("/providers/")[-1]
          by = {}
          for c in changes:
              by.setdefault(c["changeType"], []).append(name(c))
          print("### Infrastructure preview (`az deployment sub what-if`)\n")
          for kind in ("Create", "Delete", "Deploy"):
              if kind in by:
                  print(f"**{kind}** ({len(by[kind])})\n")
                  print("\n".join(f"- `{n}`" for n in by[kind]) + "\n")
          if "Create" not in by and "Delete" not in by:
              print("No resource is created or deleted.\n")
          mod = by.get("Modify", [])
          print(f"<details><summary>{len(mod)} resources reported as modified</summary>\n")
          print("Azure reports its own default values as deleted properties, so this list is long even")
          print("when nothing you changed touches them. Treat it as a list of what a deploy would re-send, not a diff.\n")
          print("\n".join(f"- `{n}`" for n in mod) + "\n\n</details>\n")
          print("Preflight validation passed. Nothing has been deployed.")
          EOF
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # One comment per pull request, updated by each push
          head -c 60000 comment.md > comment-trimmed.md
          gh pr comment "$PR_NUMBER" --body-file comment-trimmed.md --edit-last --create-if-none
