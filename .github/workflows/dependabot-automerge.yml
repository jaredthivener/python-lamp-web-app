name: Dependabot auto-merge

# Dependabot pull requests for Python, npm and Docker are set to merge themselves as soon as
# the required checks pass (the "Tests" check, enforced by the ruleset on main). Nobody
# approves or clicks.
#
# Updates to GitHub Actions are the exception: they wait for a person. Actions run with this
# repository's secrets and Azure login, and GitHub's guidance is to audit an action's source
# before using a new version (https://docs.github.com/en/actions/reference/security/secure-use).
# The Tests check does not exercise those jobs, so passing it says little about the change.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      IS_ACTIONS_UPDATE: ${{ startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/') }}
    steps:
      - name: Merge once the required checks pass
        if: env.IS_ACTIONS_UPDATE == 'false'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why this one is waiting
        if: env.IS_ACTIONS_UPDATE == 'true'
        run: echo "::notice::This updates GitHub Actions, which run with this repository's secrets. Read what changed in the action, then merge it by hand."
